version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tylersoft_db
    environment:
      POSTGRES_DB: tylersoft_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tylersoft_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tylersoft_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      JWT_SECRET: YourSuperSecretKeyThatIsAtLeast256BitsLong1234567890
      JWT_EXPIRATION_MS: 86400000
      APP_MAX_FAILED_ATTEMPTS: 5
      APP_LOCK_DURATION_MINUTES: 30
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tylersoft_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:
