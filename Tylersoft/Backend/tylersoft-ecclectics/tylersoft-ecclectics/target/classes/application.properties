# ─── DataSource ───────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/tylersoft_db?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=Sadie123
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ─── Schema init ──────────────────────────────────────────────
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema.sql

# ─── JWT ──────────────────────────────────────────────────────
jwt.secret=YourSuperSecretKeyThatIsAtLeast256BitsLong1234567890
jwt.expiration-ms=86400000

# ─── Account locking ──────────────────────────────────────────
app.max-failed-attempts=5
app.lock-duration-minutes=30

# ─── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000

# ─── Server ───────────────────────────────────────────────────
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# ─── Logging ──────────────────────────────────────────────────
logging.level.com.tylersoft=DEBUG
logging.level.org.springframework.security=INFO

# ─── File Upload Limits ─────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
